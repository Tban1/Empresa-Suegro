<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - STI Servicios Técnicos Industriales</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Galería de trabajos de STI. Proyectos de mantenimiento industrial con compresores, bombas, grúas y más equipos especializados.">
    <meta name="keywords" content="galería proyectos, trabajos realizados, mantenimiento industrial, equipos técnicos, STI">
    <meta name="robots" content="index, follow">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar">
        <div class="container">
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#quienes-somos">Quiénes Somos</a></li>
                <li><a href="index.html#servicios">Servicios</a></li>
                <li><a href="index.html#por-que-sti">Por Qué STI</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <!-- Galería -->
    <section class="galeria-section">
        <div class="container">
            <div class="galeria-header">
                <a href="index.html#servicios" class="btn btn-secondary">← Volver</a>
                <h1 id="galeria-titulo">Galería de Trabajo</h1>
                <p id="galeria-descripcion"></p>
            </div>

            <div class="galeria-grid" id="galeria-grid">
                <!-- Las imágenes se cargarán dinámicamente aquí -->
            </div>

            <!-- Modal para ver imagen grande -->
            <div id="modal" class="modal">
                <span class="modal-close">&times;</span>
                <img id="modal-image" src="" alt="Imagen ampliada">
                <div class="modal-caption" id="modal-caption"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 STI - Servicios Técnicos Industriales. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        // Menú hamburguesa
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');

        if (hamburger) {
            hamburger.addEventListener('click', function() {
                navLinks.classList.toggle('active');
                hamburger.classList.toggle('active');
            });

            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', function() {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                });
            });
        }
    </script>

    <script src="galeria-script.js"></script>
</body>
</html>
